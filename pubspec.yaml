name: pcg_hymns
description: An offline-first digital hymnbook for Presbyterian worship.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  just_audio: ^0.10.6
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  http: ^1.2.2
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
  assets:
    - assets/catalogue.json